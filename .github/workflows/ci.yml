name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version: "24"
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]

      - name: Check
        run: vp check

      - name: Test
        run: vp test

      - name: Build package
        run: vp run repo:build

      - name: Validate package metadata
        run: vp run lint:package

      - name: Validate package types
        run: vp run lint:types
